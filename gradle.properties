org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ★ AGP 9 必需的两个开关（官方 AGP 9.0 release notes 明确写了：
#   「org.jetbrains.kotlin.android plugin is not compatible with the new DSL」）
#   - builtInKotlin=false：关掉 AGP 9 内置的 Kotlin 支持，继续用 KGP
#   - newDsl=false：沿用 AGP 8 的 DSL 形态，避免大改 build 脚本
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
