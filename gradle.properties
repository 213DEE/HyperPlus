org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ★ AGP 9 的两个兼容开关 —— 2026-10-03 已**全部删掉**（迁移到官方默认形态）
#
#   原来这里写着：
#       android.builtInKotlin=false   # 关掉 AGP 内置 Kotlin，继续用 KGP 插件
#       android.newDsl=false          # 沿用 AGP 8 的 DSL 形态
#   当时加它们是照 AGP 9.0 release notes 那句「org.jetbrains.kotlin.android plugin is
#   not compatible with the new DSL」—— 那句话只说明**KGP 插件**不能与新 DSL 共存，
#   而正确的解法是**不要再用 KGP 插件**（用 AGP 内置的 Kotlin 支持），
#   而不是把新 DSL 关掉。沿着"关掉新 DSL"这条路走，会一直留在 AGP 8 的形态上：
#   AGP 已经把这两个开关标成 deprecated（"It will be removed in version 10.0"），
#   到 AGP 10 会**一次性爆**。
#
#   实测（本机 AGP 9.4 + Gradle 9.6 + JDK 21）：删掉这两行 + 去掉 KGP 插件之后，
#   `assembleDebug` 直接通过，且原先的
#       WARNING: API 'applicationVariants' is obsolete …（legacy variant API）
#       w: Deprecated 'org.jetbrains.kotlin.android' plugin usage
#   一并消失 —— 那两条本来就是"我们自己打开 legacy 形态"招来的。
#   ⚠️ 因此**不要**为了消除警告去加 `android.sync.suppressAgpWarnings=…`：
#     那是把症状盖住，不是把症状去掉。
#   ⛔ 也别再把这两行加回来。真要回退，先看 app/build.gradle.kts 里 Kotlin 是怎么声明的。

# ★★ 构建必须用 **JDK 21**（2026-09-29，实测踩出来的，别"顺手降回 17"）
#
#   根因：MiuiX 0.9.4 的**所有** class 文件都是 JVM target 21（major 65 —— 逐个 aar
#   解包用 od 读出来的，含 miuix-ui / miuix-blur / miuix-nav）。
#   ⇒ 三件事全都被它卡住，只有 21 能同时满足：
#     ① 主源码：`miuix-nav` 的 `NavEntryBuilder.entry<T>()` 是 `inline fun <reified T>`，
#        内联时 Kotlin 会拒绝"把 JVM 21 的字节码内联进 JVM 17" ——
#             Cannot inline bytecode built with JVM target 21 into bytecode that
#             is being built with JVM target 17.
#        本工程 7 个路由全走 `entry<Route.X>` ⇒ 一行都编不过。（没法规避：`NavEntry`
#        是库的 internal 类型，低层重载外部拿不到。）
#     ② 单测：主源码编到 21 之后，测试 JVM 若是 17 会直接拒绝加载 main 的类 ——
#             has been compiled by a more recent version of the Java Runtime (class file
#             version 65.0), this version of the Java Runtime only recognizes ... up to 61.0
#        13 个测试类全部报这条（`testDebugUnitTest` 直接 FAILED）。
#     ③ javac：`compileOptions` 提到 21 需要能产出 21 的 javac。
#
#   ⇒ 装法（本机已有，装在 E 盘，**没动任何全局环境变量**）：
#        Temurin JDK 21.0.12.1 解压在 `E:\jdk-21`
#      ⚠️ 若换机器 / 挪目录，**只改下面这一行**；JDK 版本要求写在这里是为了让
#        "为什么必须 21"和"21 在哪"放在同一个地方 —— 它们永远要一起改。
#      ⚠️ 用 `org.gradle.java.home` 而不是让调用方每次带 `JAVA_HOME=`：
#        前者对 IDE、命令行、CI 一视同仁（Gradle 自己会用它起 daemon），
#        后者在忘了带的时候会静默退回 JDK 17，然后报出上面那两条**看起来毫不相干**的错。
#      ⚠️ 克隆本项目的人请注意：下面这一行是**作者本机的路径**，请改成你自己的 JDK 21
#        安装路径（Windows 也写成 `E:/xxx` 这种正斜杠形式）；或者删掉这一行，改为在
#        环境变量里设置 `JAVA_HOME`。保持原样不动 = 本机没有 E:\jdk-21 = Gradle 直接失败。
org.gradle.java.home=E:/jdk-21

kotlin.code.style=official

